vehicle_config:
  # Vehicle dynamics
  max_speed: 10.0 # [km/h]
  max_a_lon: 1.0 # [m/s^2]
  max_a_lat: 1.0 # [m/s^2]
  # Vehicle dimensions
  cg_to_front: 3.5 # [m]
  cg_to_rear: 1.0 # [m]
  width: 1.8 # [m]

rs_path:
  resolution: 0.1 # [m] Reeds-Shepp path resolution
  turning_radius: 6.0 # [m] Reeds-Shepp path turning radius

observation:
  # Occupancy grid
  grid_size: 256 # [-]
  grid_resolution: 0.2 # [m]
  history_length: 3 # [-]
  sigma: 1.0 # [m]
  buffer: 3.0 # [m]

env:
  # Simulation environment
  max_steps: 200 # [-]
  dt: 0.2 # [s]
  # Initial state
  initial_position: 15.0  # [m]
  initial_heading: 180.0  # [deg]
  # Terminal condition
  iou_threshold: 0.75 # [-]
  zero_speed: 0.5 # [km/h]

train:
  # Hyper parameters
  learning_rate: 0.00001
  weight_decay: 0.0001
  gamma: 0.99
  tau: 0.005
  alpha: 0.5
  # Training
  num_episodes: 1000
  random_steps: 25
  update_after: 10
  update_every: 5
  update_repeat: 10
  # Checkpoint
  render: false
  dir: "./checkpoints"

curriculum:
  # Initial state
  initial_position: [1.5, 3.0, 5.0, 10.0, 15.0]  # [m]
  initial_heading: [3.0, 5.0, 10.0, 20.0, 40.0]  # [deg]
  # Terminal condition
  iou_threshold: [0.7, 0.7, 0.7, 0.7, 0.7] # [-]
  zero_speed: [3.0, 2.0, 1.0, 0.75, 0.5] # [km/h]
  # Next level
  success_rate: [0.9, 0.85, 0.8, 0.75, 0.7]
  window_size: [100, 60, 40, 20, 10]

eval:
  num_episodes: 10